[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pactnet"
version = "1.0.0"
description = "Consumer-Driven Contract Testing Framework for Service-to-Service APIs"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Prem Kumar"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.scripts]
pactnet = "pactnet.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pactnet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
