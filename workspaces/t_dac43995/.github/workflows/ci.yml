name: PactNet CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Run contract verification
        run: |
          # Start a test provider (using mock server)
          pactnet serve --pact-file examples/order-service-pact.json --port 8080 &
          sleep 2
          # Verify against the mock provider
          pactnet verify --pact-file examples/order-service-pact.json --provider-url http://localhost:8080

  contract-check:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check contract compatibility
        run: |
          if [ -f examples/order-service-pact-v1.json ] && [ -f examples/order-service-pact-v2.json ]; then
            pactnet compare --old examples/order-service-pact-v1.json --new examples/order-service-pact-v2.json
          fi
