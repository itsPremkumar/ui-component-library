[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docgenie"
version = "1.0.0"
description = "Automated API Documentation Generator from OpenAPI/Swagger specs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Prem Kumar", email = "prem@example.com" },
]
keywords = ["openapi", "swagger", "api-documentation", "docs-generator"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
]

dependencies = [
    "click>=8.0",
    "jinja2>=3.0",
    "rich>=13.0",
    "deepdiff>=6.0",
    "fpdf2>=2.7",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
docgenie = "docgenie.cli:main"

[project.urls]
Homepage = "https://github.com/itsPremkumar/api-docs-generator"
Repository = "https://github.com/itsPremkumar/api-docs-generator"

[tool.hatch.build.targets.wheel]
packages = ["src/docgenie"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/docgenie"]
